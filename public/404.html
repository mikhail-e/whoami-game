<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- server.js sends this page, with status 404, for any address nothing else
         answers. It can be shown at any depth (/a/b/c), so every link starts at
         the site root. -->
    <title data-i18n="notFoundTitle">Page not found</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#16213e">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/translations.js"></script>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <p class="h1 text-white mb-3" data-i18n="title">🎭 Who am I?</p>
        </div>
        <div class="game-card text-center">
            <h1 class="h3 mb-3" data-i18n="notFoundTitle">Page not found</h1>
            <p data-i18n="notFoundText">There is nothing at this address. The game is on the main page.</p>
            <a href="/" class="btn btn-primary btn-lg" data-i18n="openGame">Open the game</a>
        </div>
    </div>
</body>
</html>
